name: FTP Deploy on Push

on:
  push:
    branches:
    - main
    paths-ignore:
      - '.github/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ftp-${{ github.ref }}
      cancel-in-progress: true

    env:
      # Intelligent handling: ensure trailing slash for FTP_DIR
      SERVER_DIR: ${{ endsWith(secrets.FTP_DIR, '/') && secrets.FTP_DIR || format('{0}/', secrets.FTP_DIR) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to BunnyCDN Storage (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ env.SERVER_DIR }}/app/   # ✅ upload inside /app/
          local-dir: ./out/
          exclude: |
            **/.git/**
            .github/**
            .gitignore
            **/.DS_Store
            node_modules/**
            coverage/**
            **/*.map
