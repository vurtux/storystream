name: FTP Deploy on Push

on:
  push:
    branches:
      - '**'                 # change to ["main"] if you only want main
    paths-ignore:
      - '.github/**'         # don't run if only workflow files changed
      - '.gitignore'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ftp-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Optional: show what changed in this push
      - name: Git diff summary
        run: |
          echo "Changed files in this push:"
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} || true

      - name: Deploy to FTP / FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # For FTPS set this secret to "ftps"; leave unset for plain FTP
          protocol: ${{ secrets.FTP_PROTOCOL }}
          # Optional custom port via secret (e.g., 21 for FTP, 990 for implicit FTPS)
          port: ${{ secrets.FTP_PORT }}
          # Remote target directory (e.g., /public_html/app)
          server-dir: ${{ secrets.FTP_DIR }}
          # Local directory to upload (repo root by default)
          local-dir: .
          # Exclusions (won't be uploaded)
          exclude: |
            **/.git/**
            .github/**
            .gitignore
            **/.DS_Store
            node_modules/**
            coverage/**
            **/*.map
