name: Deploy to GCE VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Remove dev dependencies
        run: npm prune --omit=dev

      - name: Pack release bundle
        run: |
          tar czf app-release.tgz \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.js \
            node_modules

      - name: Upload and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts

          # Ensure base deploy path exists
          ssh -i ~/.ssh/deploy_key \
            $DEPLOY_USER@$DEPLOY_HOST \
            "mkdir -p $DEPLOY_PATH"

          # Upload release archive
          scp -i ~/.ssh/deploy_key \
            app-release.tgz \
            $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/app-release.tgz

          # Deploy on server
          ssh -i ~/.ssh/deploy_key \
            $DEPLOY_USER@$DEPLOY_HOST << EOF

            set -e

            cd $DEPLOY_PATH

            echo "Cleaning previous temp release..."
            rm -rf current_new

            echo "Creating release directory..."
            mkdir current_new

            echo "Extracting release..."
            tar xzf app-release.tgz -C current_new

            echo "Rotating releases..."
            rm -rf current_old || true

            if [ -d current ]; then
              mv current current_old
            fi

            mv current_new current

            cd current

            echo "Stopping old PM2 process..."
            pm2 delete next-app || true

            echo "Starting Next.js app..."
            pm2 start npm --name next-app -- start

            echo "Saving PM2 state..."
            pm2 save

            echo "Waiting for app..."
            sleep 10

            echo "Health check..."
            curl -I http://localhost:3000

            echo "PM2 Status:"
            pm2 status

          EOF

      - name: Final health check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            $DEPLOY_USER@$DEPLOY_HOST \
            "curl -I http://localhost:3000"
