name: Deploy to GCE VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps and build
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Pack full app bundle
        run: |
          tar czf app-release.tgz \
            .next \
            public \
            next.config.js \
            package.json \
            package-lock.json \
            node_modules

      - name: Upload and activate on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KEY:  ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Upload tar
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no app-release.tgz \
            $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/app-release.tgz

          # Extract release atomically
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST "
            set -e
            cd $DEPLOY_PATH

            rm -rf current_new
            mkdir current_new

            tar xzf app-release.tgz -C current_new

            rm -rf current_old
            if [ -d current ]; then mv current current_old; fi
            mv current_new current

            pm2 delete next-app >/dev/null 2>&1 || true
            pm2 start \"npx next start -p 3000\" --name next-app --cwd $DEPLOY_PATH/current
            pm2 save
          "

      - name: Health check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          sleep 10
          curl -I http://$DEPLOY_HOST:3000
