name: Deploy to GCE VM (Safe Artifact Model)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ✅ Clean, deterministic install + build
      - name: Install deps & build
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      # ✅ Pack ONLY runtime-safe files (NO node_modules)
      - name: Pack runtime bundle
        run: |
          tar czf app-release.tgz \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.js

      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KEY:  ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # ✅ Upload tarball
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no app-release.tgz \
            $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/app-release.tgz

          # ✅ Extract + rebuild runtime deps + atomic swap + PM2 restart
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST "
            set -e

            cd $DEPLOY_PATH

            rm -rf current_old
            if [ -d current ]; then mv current current_old; fi

            mkdir -p current_new
            tar xzf releases/app-release.tgz -C current_new
            cd current_new

            # ✅ Install prod-only deps on SERVER (correct OS)
            npm ci --omit=dev

            mv $DEPLOY_PATH/current_new $DEPLOY_PATH/current

            # ✅ Ensure PM2 exists
            command -v pm2 >/dev/null 2>&1 || npm install -g pm2

            # ✅ Stable PM2 start (NO npx)
            pm2 delete next-app >/dev/null 2>&1 || true
            pm2 start npm --name next-app -- start -- --port 3000
            pm2 save

            rm -rf current_old || true
          "

          # ✅ Cleanup SSH key from runner
          rm -f ~/.ssh/deploy_key

      # ✅ REAL health check through NGINX (not port 3000)
      - name: Health check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "Waiting for app to come online via Nginx..."
          sleep 10
          if curl -fs http://$DEPLOY_HOST >/dev/null; then
            echo "✅ Deployment verified successfully via Nginx."
          else
            echo "❌ Deployment failed: Nginx did not respond correctly."
            exit 1
          fi
