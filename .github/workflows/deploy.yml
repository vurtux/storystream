name: Deploy to GCE VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # allow manual deploys from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps & build
        run: |
          npm ci
          npm run build        # generates .next
          npm prune --omit=dev

      - name: Pack runtime bundle
        run: |
          tar czf app-release.tgz \
            .next public package.json package-lock.json next.config.js node_modules

      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KEY:  ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Upload tarball
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no app-release.tgz \
            $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/app-release.tgz

          # Extract + restart pm2 (atomic swap)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST "
            set -e
            cd $DEPLOY_PATH

            rm -rf current_old
            if [ -d current ]; then mv current current_old; fi

            mkdir -p current_new
            tar xzf releases/app-release.tgz -C current_new
            mv current_new current

            # Ensure PM2 is available for deploy user
            export PATH=\$PATH:/home/deploy/.npm-global/bin
            command -v pm2 >/dev/null 2>&1 || npm install -g pm2

            # Restart the app
            pm2 delete next-app >/dev/null 2>&1 || true
            pm2 start 'npx next start -p 3000' --name next-app --cwd $DEPLOY_PATH/current
            pm2 save

            # Clean up old release
            rm -rf current_old || true
          "

      - name: Health check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "Waiting for app to come online..."
          sleep 10
          if curl -fs http://$DEPLOY_HOST:3000 >/dev/null; then
            echo "✅ Deployment verified successfully."
          else
            echo "❌ Deployment failed: app did not respond on port 3000."
            exit 1
          fi
